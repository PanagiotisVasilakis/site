name: Secure Deployment

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '20'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  security-checks:
    name: Pre-deployment Security Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      security-passed: ${{ steps.security-gate.outputs.passed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --audit=false

      - name: Run security audit
        id: audit
        run: |
          npm audit --audit-level=critical --production
          echo "audit_passed=$?" >> $GITHUB_OUTPUT

      - name: Validate environment configuration
        run: |
          # Check for required environment variables
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL secret not configured"
            exit 1
          fi
          
          # Validate build passes
          npm run build

      - name: Security gate
        id: security-gate
        run: |
          if [ "${{ steps.audit.outputs.audit_passed }}" = "0" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "::error::Security audit failed"
            exit 1
          fi

  build-and-sign:
    name: Build and Sign Artifacts
    runs-on: ubuntu-latest
    needs: security-checks
    if: needs.security-checks.outputs.security-passed == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.security
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Sign container image with Cosign
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          echo "${{ steps.meta.outputs.tags }}" | xargs -I {} cosign sign --yes {}@${{ steps.build-and-push.outputs.digest }}

      - name: Generate SLSA attestation
        uses: actions/attest-build-provenance@v1
        id: attest
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

      - name: Create deployment artifact
        run: |
          mkdir -p deployment-artifacts
          echo "${{ steps.build-and-push.outputs.digest }}" > deployment-artifacts/image-digest.txt
          echo "${{ steps.meta.outputs.tags }}" > deployment-artifacts/image-tags.txt
          echo "${{ steps.attest.outputs.bundle-path }}" > deployment-artifacts/attestation-path.txt
          
          # Create deployment manifest
          cat > deployment-artifacts/deployment.yaml << EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: villa-app
            labels:
              app: villa-app
              version: ${{ github.sha }}
          spec:
            replicas: 3
            selector:
              matchLabels:
                app: villa-app
            template:
              metadata:
                labels:
                  app: villa-app
                  version: ${{ github.sha }}
              spec:
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1001
                  fsGroup: 1001
                containers:
                - name: villa-app
                  image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
                  ports:
                  - containerPort: 3000
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    runAsNonRoot: true
                    runAsUser: 1001
                    capabilities:
                      drop:
                      - ALL
                  resources:
                    limits:
                      memory: "512Mi"
                      cpu: "500m"
                    requests:
                      memory: "256Mi"
                      cpu: "250m"
                  env:
                  - name: NODE_ENV
                    value: "production"
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: villa-app-secrets
                        key: database-url
                  livenessProbe:
                    httpGet:
                      path: /api/health
                      port: 3000
                    initialDelaySeconds: 30
                    periodSeconds: 10
                  readinessProbe:
                    httpGet:
                      path: /api/health
                      port: 3000
                    initialDelaySeconds: 5
                    periodSeconds: 5
          EOF

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts-${{ github.sha }}
          path: deployment-artifacts/
          retention-days: 90

  security-scan-image:
    name: Security Scan Built Image
    runs-on: ubuntu-latest
    needs: build-and-sign
    timeout-minutes: 10
    steps:
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download deployment artifacts
        uses: actions/download-artifact@v5
        with:
          name: deployment-artifacts-${{ github.sha }}
          path: ./artifacts

      - name: Get image digest
        id: image-info
        run: |
          IMAGE_DIGEST=$(cat ./artifacts/image-digest.txt)
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${IMAGE_DIGEST}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image-info.outputs.image_tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-sign, security-scan-image]
    environment: staging
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download deployment artifacts
        uses: actions/download-artifact@v5
        with:
          name: deployment-artifacts-${{ github.sha }}
          path: ./artifacts

      - name: Verify image signature
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          IMAGE_DIGEST=$(cat ./artifacts/image-digest.txt)
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${IMAGE_DIGEST}"
          cosign verify ${IMAGE_TAG} --certificate-identity-regexp="^https://github.com/${{ github.repository }}" --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@$(cat ./artifacts/image-digest.txt)"
          # Here you would typically:
          # 1. Apply Kubernetes manifests
          # 2. Update Helm values
          # 3. Use deployment tools like ArgoCD
          # kubectl apply -f ./artifacts/deployment.yaml

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: production
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download deployment artifacts
        uses: actions/download-artifact@v5
        with:
          name: deployment-artifacts-${{ github.sha }}
          path: ./artifacts

      - name: Verify image signature
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          IMAGE_DIGEST=$(cat ./artifacts/image-digest.txt)
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${IMAGE_DIGEST}"
          cosign verify ${IMAGE_TAG} --certificate-identity-regexp="^https://github.com/${{ github.repository }}" --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

      - name: Production deployment
        run: |
          echo "Deploying to production environment..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@$(cat ./artifacts/image-digest.txt)"
          # Production deployment steps
          # kubectl apply -f ./artifacts/deployment.yaml --namespace=production

      - name: Post-deployment verification
        run: |
          echo "Running post-deployment health checks..."
          # Add health check and smoke test commands here
          # curl -f https://villa-app.com/api/health

  notify:
    name: Deployment Notifications
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Notify deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const stagingStatus = '${{ needs.deploy-staging.result }}';
            const productionStatus = '${{ needs.deploy-production.result }}';
            
            let message = '🚀 **Deployment Status**\n\n';
            message += `- Staging: ${stagingStatus === 'success' ? '✅' : stagingStatus === 'skipped' ? '⏭️' : '❌'} ${stagingStatus}\n`;
            message += `- Production: ${productionStatus === 'success' ? '✅' : productionStatus === 'skipped' ? '⏭️' : '❌'} ${productionStatus}\n`;
            message += `\n**Commit**: ${context.sha.substring(0, 7)}\n`;
            message += `**Actor**: @${context.actor}`;
            
            // In a real environment, you might send this to Slack, Discord, or email
            console.log(message);