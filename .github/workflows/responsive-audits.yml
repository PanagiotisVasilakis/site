name: Responsive UX Audits

'on':
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  responsive-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install required npm
        run: npm install --global npm@11.18.0

      - name: Install browser runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libxss1 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libgbm1 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxkbcommon0 \
            libdrm2 \
            libcups2
          sudo apt-get install -y libasound2 || sudo apt-get install -y libasound2t64

      - name: Cache Puppeteer Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build app
        run: npm run build

      - name: Start app server
        run: npm start > /tmp/next-server.log 2>&1 &

      - name: Wait for app server
        run: npx wait-on http://localhost:3000

      - name: Run responsive UX audit
        id: responsive_audit
        continue-on-error: true
        env:
          RESPONSIVE_BASE_URL: http://localhost:3000
          RESPONSIVE_UX_FAIL_ON_ISSUES: '1'
        run: npm run ci:responsive:ux

      - name: Run Lighthouse matrix audit
        id: lighthouse_matrix
        continue-on-error: true
        env:
          LH_BASE_URL: http://localhost:3000
          LH_MATRIX_FAIL_ON_ISSUES: '1'
          LH_MATRIX_MIN_SCORE: '70'
        run: npm run ci:lighthouse:matrix

      - name: Upload responsive audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit-reports
          path: |
            reports/responsive-ux/**
            reports/lighthouse-matrix/**
            /tmp/next-server.log

      - name: Fail workflow on audit regressions
        if: always()
        run: |
          echo "Responsive audit outcome: ${{ steps.responsive_audit.outcome }}"
          echo "Lighthouse matrix outcome: ${{ steps.lighthouse_matrix.outcome }}"

          if [[ "${{ steps.responsive_audit.outcome }}" != "success" || "${{ steps.lighthouse_matrix.outcome }}" != "success" ]]; then
            echo "Responsive audit checks failed. Inspect uploaded artifacts for details."
            exit 1
          fi
