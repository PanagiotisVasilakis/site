name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NPM_VERSION: '11.18.0'

permissions:
  contents: read
  security-events: write
  actions: read
  issues: write

jobs:
  dependency-scanning:
    name: Dependency Vulnerability Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install required npm
        run: npm install --global "npm@${{ env.NPM_VERSION }}"

      - name: Install dependencies
        run: npm ci --audit=false

      - name: Run npm audit
        run: |
          npm audit --audit-level=high --omit=dev
          npm audit --json --audit-level=high --omit=dev > npm-audit-report.json || true

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=package.json

      - name: Upload Snyk results to GitHub Code Scanning
        if: env.SNYK_TOKEN != ''
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: snyk.sarif

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: |
            npm-audit-report.json
            snyk.sarif
          retention-days: 30

  secrets-scanning:
    name: Secrets Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified

  container-security:
    name: Container Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile.security -t villa-app:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'villa-app:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Docker Bench for Security
        run: |
          docker run --rm --net host --pid host --userns host --cap-add audit_control \
            -e DOCKER_CONTENT_TRUST=$DOCKER_CONTENT_TRUST \
            -v /var/lib:/var/lib:ro \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v /usr/lib/systemd:/usr/lib/systemd:ro \
            -v /etc:/etc:ro --label docker_bench_security \
            docker/docker-bench-security > docker-bench-results.txt || true

      - name: Upload container security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-reports
          path: |
            trivy-results.sarif
            docker-bench-results.txt
          retention-days: 30

  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install required npm
        run: npm install --global "npm@${{ env.NPM_VERSION }}"

      - name: Install dependencies
        run: npm ci --audit=false

      - name: Build application
        run: npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          category: "/language:javascript-typescript"

      - name: Run ESLint security rules
        run: npx eslint --config eslint.config.security.mjs --format json --output-file eslint-security-report.json .

      - name: Upload static analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            eslint-security-report.json
          retention-days: 30

  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install required npm
        run: npm install --global "npm@${{ env.NPM_VERSION }}"

      - name: Install dependencies
        run: npm ci --audit=false

      - name: License compliance check
        run: npm run security:license-check

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scanning, secrets-scanning, static-analysis, license-compliance]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./reports

      - name: Create security summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let summary = '## 🔒 Security Scan Summary\n\n';
            
            // Check for npm audit results
            try {
              const auditReport = JSON.parse(fs.readFileSync('./reports/security-audit-reports/npm-audit-report.json', 'utf8'));
              const highVulns = auditReport.metadata?.vulnerabilities?.high || 0;
              const criticalVulns = auditReport.metadata?.vulnerabilities?.critical || 0;
              summary += `- **Dependency Scan**: ${criticalVulns} critical, ${highVulns} high vulnerabilities\n`;
            } catch (e) {
              summary += `- **Dependency Scan**: ✅ No high/critical vulnerabilities\n`;
            }
            
            // Check static analysis
            try {
              const eslintReport = JSON.parse(fs.readFileSync('./reports/static-analysis-reports/eslint-security-report.json', 'utf8'));
              const errors = eslintReport.reduce((sum, file) => sum + file.errorCount, 0);
              summary += `- **Static Analysis**: ${errors} security issues found\n`;
            } catch (e) {
              summary += `- **Static Analysis**: ✅ No issues found\n`;
            }
            
            const licenseResult = '${{ needs.license-compliance.result }}';
            summary += `- **License Compliance**: ${licenseResult === 'success' ? '✅ Passed' : `❌ ${licenseResult}`}\n`;
            
            summary += '\n📋 **Full reports are available in the workflow artifacts.**';
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });