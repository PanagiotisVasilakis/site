name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NPM_VERSION: '11.18.0'

permissions:
  contents: read

jobs:
  dependency-scanning:
    name: Dependency Vulnerability Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install required npm
        run: npm install --global "npm@${{ env.NPM_VERSION }}"

      - name: Install dependencies
        run: npm ci --audit=false

      - name: Run npm audit
        run: npm audit --json --audit-level=high --omit=dev > npm-audit-report.json

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-audit-reports
          path: |
            npm-audit-report.json
          retention-days: 30

  secrets-scanning:
    name: Secrets Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          path: ./
          extra_args: --only-verified

  container-security:
    name: Container Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Build Docker image
        run: |
          docker build --build-arg NEXT_PUBLIC_SITE_URL=https://example.test -f docker/Dockerfile.security -t villa-app:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'villa-app:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          exit-code: '1'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload container security artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-security-reports
          path: |
            trivy-results.sarif
          retention-days: 30

  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install required npm
        run: npm install --global "npm@${{ env.NPM_VERSION }}"

      - name: Install dependencies
        run: npm ci --audit=false

      - name: Build application
        run: npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: "/language:javascript-typescript"

      - name: Run ESLint security rules
        run: npx eslint --config eslint.config.security.mjs --max-warnings=0 --format json --output-file eslint-security-report.json .

      - name: Upload static analysis artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-analysis-reports
          path: |
            eslint-security-report.json
          retention-days: 30

  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install required npm
        run: npm install --global "npm@${{ env.NPM_VERSION }}"

      - name: Install dependencies
        run: npm ci --audit=false

      - name: License compliance check
        run: npm run security:license-check

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scanning, secrets-scanning, container-security, static-analysis, license-compliance]
    if: always() && github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: ./reports

      - name: Create security summary
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let summary = '## 🔒 Security Scan Summary\n\n';
            
            // Check for npm audit results
            try {
              const auditReport = JSON.parse(fs.readFileSync('./reports/security-audit-reports/npm-audit-report.json', 'utf8'));
              const highVulns = auditReport.metadata?.vulnerabilities?.high || 0;
              const criticalVulns = auditReport.metadata?.vulnerabilities?.critical || 0;
              summary += `- **Dependency Scan**: ${criticalVulns} critical, ${highVulns} high vulnerabilities\n`;
            } catch (e) {
              summary += `- **Dependency Scan**: ❌ Unknown (missing or invalid report)\n`;
            }
            
            // Check static analysis
            try {
              const eslintReport = JSON.parse(fs.readFileSync('./reports/static-analysis-reports/eslint-security-report.json', 'utf8'));
              const errors = eslintReport.reduce((sum, file) => sum + file.errorCount, 0);
              summary += `- **Static Analysis**: ${errors} security issues found\n`;
            } catch (e) {
              summary += `- **Static Analysis**: ❌ Unknown (missing or invalid report)\n`;
            }
            
            const licenseResult = '${{ needs.license-compliance.result }}';
            summary += `- **License Compliance**: ${licenseResult === 'success' ? '✅ Passed' : `❌ ${licenseResult}`}\n`;
            const containerResult = '${{ needs.container-security.result }}';
            summary += `- **Container Security**: ${containerResult === 'success' ? '✅ Passed' : `❌ ${containerResult}`}\n`;
            
            summary += '\n📋 **Full reports are available in the workflow artifacts.**';
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
