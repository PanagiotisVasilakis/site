[extend]
useDefault = true

[[rules]]
id = "credential-bearing-database-url"
description = "Database URL containing embedded credentials"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis|rediss):\/\/[^:\s\/]+:([^@\s\/]{8,})@[^\s]+'''
secretGroup = 1
keywords = [
  "postgres://",
  "postgresql://",
  "mysql://",
  "mariadb://",
  "mongodb://",
  "mongodb+srv://",
  "redis://",
  "rediss://",
]

[[rules]]
id = "private-key-material"
description = "PEM private-key material"
regex = '''-----BEGIN(?: [A-Z0-9]+)? PRIVATE KEY-----'''
secretGroup = 0
keywords = ["PRIVATE KEY"]

[[rules]]
id = "booking-calendar-export-token"
description = "Booking.com calendar export URL with its t= access token"
regex = '''(?i)\b(?:ical\.booking\.com/v1/export|admin\.booking\.com/hotel/hoteladmin/ical\.html)\?(?:[^\s"'`#&]*&)*t=([A-Za-z0-9_-]{8,})'''
secretGroup = 1
keywords = ["ical.booking.com", "hoteladmin/ical"]
