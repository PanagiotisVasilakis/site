# Log rotation for the Nginx ingress container (docs/deployment/origin-ingress-runbook.md, "Error
# log rotation"; docs/deployment/day-0-runbook.md says where to install this file).
#
#   install -m 0644 -o root -g root deploy/host/logrotate-nginx.conf /etc/logrotate.d/qr-city-guide-nginx
#
# The paths are those of the day-0 layout: the container mounts /opt/qr-city-guide/nginx/logs as
# /var/log/nginx. Change them here if you chose another directory. That directory must have mode
# 0711 (or more open), not 0700: after "docker kill -s USR1" the Nginx worker processes, which run
# as the user "nginx" and not as root, reopen the log files by name themselves. In a root-only
# directory they fail with "open() ... failed (13: Permission denied)" and keep writing to the
# files that were rotated away, so the new files stay empty. The directory above it
# (/opt/qr-city-guide/nginx, mode 0700) keeps the other users of the host out.
#
# error.log can contain client IP addresses and request lines, and the privacy notice promises
# that it is kept for 14 days. "rotate 13" keeps the current file and 13 daily files, so a line
# is deleted at the latest when it is 14 days old (later only if a daily run is late or missed).
# Two things would break that promise:
#   - a rule that skips rotation on a day without new lines (the skip-when-empty option), because
#     the files already rotated would then stop ageing. Both stanzas below say "ifempty"
#     explicitly, which overrides such a rule when /etc/logrotate.conf sets it for all logs (the
#     day-0 runbook still has you look at that file);
#   - a count other than 13 without a matching change of the notice.
# Rotated files are compressed; that changes their size, not their age.
#
# "docker kill -s USR1" makes the Nginx master reopen its log files and tell the workers to do the
# same, so new lines go to the new file. A stopped container is not an error here.
#
# logrotate runs once a day (the system timer), so "daily" means one rotation per run. There is
# no size limit between two runs: a flood of requests can grow a log by any amount in a day, and
# nothing here stops it. That risk is covered by the disk check of deploy/host/check-host.sh
# (CHECK_DISK_MAX_PERCENT, docs/deployment/monitoring-and-alerting.md, "Host checks"), not by this file.

/opt/qr-city-guide/nginx/logs/error.log {
    daily
    rotate 13
    ifempty
    missingok
    compress
    delaycompress
    postrotate
        docker kill -s USR1 origin-nginx >/dev/null 2>&1 || true
    endscript
}

# access.log has no client address (the origin_safe format of nginx.conf.template). "rotate 7"
# keeps the current file and 7 daily files, so a line is deleted at the latest when it is 8 days
# old.
/opt/qr-city-guide/nginx/logs/access.log {
    daily
    rotate 7
    ifempty
    missingok
    compress
    delaycompress
    postrotate
        docker kill -s USR1 origin-nginx >/dev/null 2>&1 || true
    endscript
}
